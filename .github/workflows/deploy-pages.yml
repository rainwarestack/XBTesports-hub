name: Publish static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Include live scoreboard pages
        run: |
          cp -R public/admin site/admin
          cp -R public/overlay site/overlay
          cp -R public/activetournament site/activetournament
          cp -R public/funding site/funding
          cp -R public/contact site/contact
          cp -R public/xbt/* site/
          cp public/scoreboard-data.js site/scoreboard-data.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
