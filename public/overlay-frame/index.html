<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XBTesports OBS Frame</title>
  <link rel="stylesheet" href="frame.css?v=1">
</head>
<body>
  <main class="frame" aria-hidden="true">
    <section class="top-band">
      <div class="top-band__left">
        <span class="brand-mark">X</span>
        <div class="brand-copy">
          <strong>XBTESPORTS</strong>
          <span>Broadcast Overlay</span>
        </div>
      </div>
      <div class="top-band__center"></div>
      <div class="top-band__right">
        <span class="status-pill">LIVE FEED</span>
        <span class="status-pill">MATCH DAY</span>
      </div>
    </section>

    <section class="bottom-band">
      <div class="bottom-band__left">
        <span class="accent-stripe"></span>
        <span class="accent-stripe"></span>
        <span class="accent-stripe"></span>
        <span class="accent-label">Arena Broadcast</span>
      </div>

      <div class="bottom-band__center">
        <span class="signal-line"></span>
      </div>

      <div class="leaderboard-pocket">
        <span class="leaderboard-pocket__label">Leaderboard</span>
        <span class="leaderboard-pocket__corner leaderboard-pocket__corner--top"></span>
        <span class="leaderboard-pocket__corner leaderboard-pocket__corner--bottom"></span>
      </div>
    </section>
  </main>
</body>
</html>
