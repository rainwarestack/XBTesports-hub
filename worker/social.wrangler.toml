name = "xbtesports-social"
main = "social/worker.mjs"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
keep_vars = true

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

[vars]
ALLOWED_ORIGINS = "https://xbtesports.nyc,https://www.xbtesports.nyc,http://127.0.0.1:8787,http://localhost:8787"

[[d1_databases]]
binding = "SOCIAL_DB"
database_name = "xbtesports-social"
database_id = "977c2f9c-be13-41fb-97f4-a49b67cc9fe8"
migrations_dir = "social/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "xbtesports-social-media"
